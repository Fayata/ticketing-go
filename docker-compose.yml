services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-your_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_strong_password_here}
      POSTGRES_DB: ${DB_NAME:-ticketing_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-your_db_user} -d ${DB_NAME:-ticketing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    container_name: ticketing-gateway
    environment:
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT:-8081}
      - TICKET_SERVICE_URL=http://ticket-service:${TICKET_SERVICE_PORT:-8082}
      - NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT:-8083}
      - ADMIN_SERVICE_URL=http://admin-service:${ADMIN_SERVICE_PORT:-8084}
      - GATEWAY_PORT=${GATEWAY_PORT:-3003}
    ports:
      # HANYA port Gateway yang dibuka keluar (port 3003). 
      - "${GATEWAY_PORT:-3003}:${GATEWAY_PORT:-3003}"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      ticket-service:
        condition: service_started
      notification-service:
        condition: service_started
      admin-service:
        condition: service_started
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - ticketing-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: ticketing-auth
    environment:
      - DB_HOST=postgres
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-8081}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - ticketing-network

  ticket-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ticket-service
    container_name: ticketing-ticket
    environment:
      - DB_HOST=postgres
      - TICKET_SERVICE_PORT=${TICKET_SERVICE_PORT:-8082}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - ticketing-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    container_name: ticketing-notification
    environment:
      - DB_HOST=postgres
      - NOTIFICATION_SERVICE_PORT=${NOTIFICATION_SERVICE_PORT:-8083}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - ticketing-network

  admin-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin-service
    container_name: ticketing-admin
    environment:
      - DB_HOST=postgres
      - ADMIN_SERVICE_PORT=${ADMIN_SERVICE_PORT:-8084}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./templates:/app/templates
      - ./static:/app/static
      - ./logs:/app/logs
    networks:
      - ticketing-network

volumes:
  postgres_data:

networks:
  ticketing-network:
    driver: bridge